<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elyria — GED</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />
  <script src="static/elyria-ui.js"></script>
  <script>window.tailwind = { config: ElyriaUI.tailwindConfig() };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="static/styles.css" />
  <style>
    .ged-item { border:1px solid rgba(255,255,255,.04); border-radius:.4rem; transition:all .15s; cursor:pointer; }
    .ged-item:hover { background:rgba(255,255,255,.02); border-color:rgba(255,255,255,.08); }
    .ged-item.active { background:rgba(139,92,246,.08); border-color:rgba(139,92,246,.2); }
    .ged-type-badge { font-size:8px; padding:1px 5px; border-radius:3px; font-weight:700; text-transform:uppercase; }
    .ged-type-openapi { background:rgba(139,92,246,.12); color:#a78bfa; border:1px solid rgba(139,92,246,.2); }
    .ged-type-arazzo { background:rgba(16,185,129,.12); color:#34d399; border:1px solid rgba(16,185,129,.2); }
    .ged-type-markdown { background:rgba(59,130,246,.12); color:#60a5fa; border:1px solid rgba(59,130,246,.2); }
    .ged-type-other { background:rgba(107,114,128,.12); color:#9ca3af; border:1px solid rgba(107,114,128,.2); }
    #ged-viewer-content h1 { font-size:1.4rem; font-weight:700; color:#f3f4f6; margin-bottom:1rem; padding-bottom:.5rem; border-bottom:1px solid rgba(255,255,255,.07); }
    #ged-viewer-content h2 { font-size:1.15rem; font-weight:600; color:#e5e7eb; margin-top:1.5rem; margin-bottom:.5rem; }
    #ged-viewer-content h3 { font-size:1rem; font-weight:600; color:#d1d5db; margin-top:1rem; margin-bottom:.4rem; }
    #ged-viewer-content p { color:#9ca3af; line-height:1.7; margin-bottom:.6rem; font-size:.8rem; }
    #ged-viewer-content code { background:rgba(139,92,246,.1); color:#c4b5fd; padding:.1rem .35rem; border-radius:.2rem; font-family:'JetBrains Mono',monospace; font-size:.75rem; }
    #ged-viewer-content pre { background:#0f1629; border:1px solid rgba(255,255,255,.06); border-radius:.5rem; padding:.85rem 1rem; overflow-x:auto; font-family:'JetBrains Mono',monospace; font-size:.75rem; line-height:1.6; color:#d1d5db; }
    #ged-viewer-content table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.78rem; border:1px solid rgba(255,255,255,.06); border-radius:.4rem; overflow:hidden; }
    #ged-viewer-content th { text-align:left; padding:.5rem .7rem; background:rgba(139,92,246,.08); color:#c4b5fd; font-weight:600; font-size:.7rem; text-transform:uppercase; }
    #ged-viewer-content td { padding:.45rem .7rem; color:#d1d5db; border-top:1px solid rgba(255,255,255,.04); }
    #ged-viewer-content a { color:#c4b5fd; }
  </style>
</head>
<body class="h-full bg-base-900 text-gray-200 font-['Inter',sans-serif] overflow-hidden">

  <header id="elyria-header"></header>
  <script>
    (function() {
      var ph = document.getElementById('elyria-header');
      if (ph) ph.outerHTML = ElyriaUI.renderHeader({
        active: 'ged',
        centerHTML: '<button id="btn-ged-skills" onclick="toggleSkillsFilter()" class="h-8 px-3 rounded-lg bg-violet-500/10 hover:bg-violet-500/20 border border-violet-500/15 hover:border-violet-500/30 text-xs font-medium text-violet-400 hover:text-violet-300 transition-all flex items-center gap-1.5"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>Skills</button>'
      });
    })();
  </script>

  <div class="flex h-[calc(100vh-3rem)]">
    <!-- Sidebar: document list -->
    <aside class="w-72 min-w-[240px] bg-base-800 border-r border-white/5 flex flex-col shrink-0">
      <div class="p-2.5 border-b border-white/5 space-y-2">
        <div class="flex items-center justify-between">
          <span id="ged-sidebar-label" class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Documents</span>
          <button id="btn-ged-upload" class="h-6 w-6 rounded-md hover:bg-violet-500/15 flex items-center justify-center text-gray-500 hover:text-violet-400 transition-colors" title="Ajouter un document">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          </button>
        </div>
        <select id="ged-filter-type" class="w-full h-6 px-1.5 rounded-md bg-base-700 border border-white/5 text-[10px] text-gray-400 focus:outline-none focus:border-violet-500/30">
          <option value="">Tous les types</option>
          <option value="openapi">OpenAPI</option>
          <option value="arazzo">Arazzo</option>
          <option value="markdown">Markdown</option>
          <option value="other">Autre</option>
        </select>
        <input id="ged-search" type="text" placeholder="Rechercher..." class="w-full h-6 px-2 rounded-md bg-base-700 border border-white/5 text-[10px] text-gray-300 placeholder-gray-600 focus:outline-none focus:border-violet-500/30" />
      </div>
      <div id="ged-list" class="flex-1 overflow-y-auto p-1.5 space-y-0.5 scrollbar-thin">
        <div id="ged-empty" class="flex flex-col items-center justify-center h-full text-center px-4">
          <div class="w-10 h-10 rounded-xl bg-base-700/30 flex items-center justify-center mb-2">
            <svg class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12H9m1.5-3.75H9m4.5 7.5H5.625c-.621 0-1.125-.504-1.125-1.125V4.875c0-.621.504-1.125 1.125-1.125h7.875M15.75 6.75h4.875c.621 0 1.125.504 1.125 1.125v3.375"/></svg>
          </div>
          <p class="text-[10px] text-gray-600">Aucun document</p>
        </div>
      </div>

    </aside>

    <!-- Main: viewer -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <div id="ged-viewer-empty" class="flex flex-col items-center justify-center h-full text-center">
        <div class="w-16 h-16 rounded-2xl bg-purple-500/5 border border-purple-500/10 flex items-center justify-center mb-4">
          <svg class="w-8 h-8 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
        </div>
        <h3 class="text-sm font-semibold text-white mb-2">GED</h3>
        <p class="text-xs text-gray-500 max-w-md">Selectionnez un document dans la liste pour le visualiser,<br/>ou cliquez sur + pour en ajouter un nouveau.</p>
      </div>
      <div id="ged-viewer" class="hidden flex-1 flex flex-col overflow-hidden">
        <div class="px-4 py-2 border-b border-white/5 flex items-center gap-3 shrink-0 bg-base-800/30">
          <span id="ged-viewer-type" class="ged-type-badge ged-type-other"></span>
          <div class="min-w-0">
            <span id="ged-viewer-name" class="text-xs font-medium text-gray-200 truncate block"></span>
            <span id="ged-viewer-snippet" class="text-[9px] text-gray-500 truncate hidden"></span>
          </div>
          <div class="flex-1"></div>
          <a id="ged-viewer-download" href="#" class="h-7 px-3 rounded-md bg-violet-500/10 hover:bg-violet-500/20 border border-violet-500/20 text-[10px] text-violet-300 font-medium transition-all flex items-center gap-1.5 no-underline">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
            Telecharger
          </a>
        </div>
        <div id="ged-viewer-content" class="flex-1 overflow-y-auto p-6 scrollbar-thin"></div>
      </div>
    </main>
  </div>

  <!-- Upload modal -->
  <div id="ged-modal" class="fixed inset-0 bg-base-900/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center">
    <div class="bg-base-800 border border-white/5 rounded-xl p-6 w-[460px] shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-semibold text-white">Ajouter un document</h3>
        <button onclick="closeGedModal()" class="w-6 h-6 rounded-md hover:bg-white/5 flex items-center justify-center text-gray-500 hover:text-gray-300">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="ged-drop-zone" class="border-2 border-dashed border-white/10 hover:border-violet-500/30 rounded-xl p-8 text-center cursor-pointer transition-all mb-4">
        <input type="file" id="ged-file-input" style="display:none" />
        <div id="ged-drop-content">
          <svg class="w-8 h-8 text-gray-600 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
          <p class="text-xs text-gray-400">Glissez-deposez un fichier</p>
          <p class="text-[10px] text-gray-600 mt-1">ou cliquez pour parcourir</p>
        </div>
        <div id="ged-file-selected" class="hidden">
          <p id="ged-file-name" class="text-xs font-medium text-violet-300 font-mono"></p>
          <p id="ged-file-size" class="text-[10px] text-gray-500 mt-1"></p>
        </div>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-[10px] uppercase text-gray-500 font-semibold block mb-1">Nom</label>
          <input id="ged-name" type="text" placeholder="Nom du document" class="w-full h-9 px-3 rounded-lg bg-base-700 border border-white/5 text-xs text-gray-200 focus:outline-none focus:border-violet-500/40" />
        </div>
        <div>
          <label class="text-[10px] uppercase text-gray-500 font-semibold block mb-1">Type</label>
          <select id="ged-type" class="w-full h-9 px-3 rounded-lg bg-base-700 border border-white/5 text-xs text-gray-200 focus:outline-none focus:border-violet-500/40">
            <option value="openapi">OpenAPI</option>
            <option value="arazzo">Arazzo</option>
            <option value="markdown">Markdown</option>
            <option value="other">Autre</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] uppercase text-gray-500 font-semibold block mb-1">Snippet (description courte)</label>
          <textarea id="ged-snippet" rows="2" placeholder="Description du contenu du fichier..." class="w-full p-3 rounded-lg bg-base-700 border border-white/5 text-xs text-gray-200 focus:outline-none focus:border-violet-500/40 resize-none"></textarea>
        </div>
      </div>
      <div id="ged-msg" class="mt-3 hidden"></div>
      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closeGedModal()" class="h-8 px-4 rounded-lg bg-base-700 text-xs text-gray-400 hover:bg-base-600 transition-all">Annuler</button>
        <button id="btn-ged-save" class="h-8 px-4 rounded-lg bg-violet-500 hover:bg-violet-400 text-xs font-medium text-white transition-all disabled:opacity-40 flex items-center gap-1.5" disabled>
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Enregistrer
        </button>
      </div>
    </div>
  </div>

  <!-- Skill editor modal -->
  <div id="skill-modal" class="fixed inset-0 bg-base-900/90 backdrop-blur-sm z-[130] hidden flex items-center justify-center">
    <div class="bg-base-800 border border-white/5 rounded-2xl shadow-2xl w-[600px] max-h-[85vh] overflow-hidden flex flex-col">
      <div class="px-5 py-3 border-b border-white/5 flex items-center justify-between shrink-0">
        <h3 class="text-sm font-semibold text-white" id="skill-modal-title">Nouveau Skill</h3>
        <button onclick="closeSkillModal()" class="w-6 h-6 rounded-md hover:bg-white/5 flex items-center justify-center text-gray-500 hover:text-gray-300"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <div class="p-5 space-y-3 overflow-y-auto">
        <div class="flex gap-3">
          <div class="flex-1"><label class="text-[10px] text-gray-500 block mb-1">Skill ID</label><input id="sk-editor-id" type="text" class="w-full h-8 px-2 rounded-lg bg-base-700 border border-white/8 text-xs font-mono text-gray-200 focus:outline-none focus:border-violet-500/40" placeholder="mon-skill" /></div>
          <div class="flex-1"><label class="text-[10px] text-gray-500 block mb-1">Nom</label><input id="sk-editor-name" type="text" class="w-full h-8 px-2 rounded-lg bg-base-700 border border-white/8 text-xs text-gray-200 focus:outline-none focus:border-violet-500/40" placeholder="Mon Skill" /></div>
        </div>
        <div><label class="text-[10px] text-gray-500 block mb-1">Description</label><input id="sk-editor-desc" type="text" class="w-full h-8 px-2 rounded-lg bg-base-700 border border-white/8 text-xs text-gray-200 focus:outline-none focus:border-violet-500/40" placeholder="Decrit ce que fait ce skill..." /></div>
        <div><label class="text-[10px] text-gray-500 block mb-1">Contenu (Markdown)</label><textarea id="sk-editor-content" class="w-full h-64 px-3 py-2 rounded-lg bg-base-700 border border-white/8 text-xs font-mono text-gray-300 focus:outline-none focus:border-violet-500/40 resize-none" placeholder="## Identity&#10;You are a specialized agent that...&#10;&#10;## Methodology&#10;1. ...&#10;&#10;## Tool Usage&#10;- ...&#10;&#10;## Rules&#10;- ..."></textarea></div>
      </div>
      <div class="px-5 py-3 border-t border-white/5 flex justify-between bg-base-900/30 shrink-0">
        <button onclick="deleteSkillFromEditor()" id="btn-skill-delete" class="h-8 px-3 rounded-lg bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-xs text-red-400 transition-all hidden">Supprimer</button>
        <div class="flex gap-2 ml-auto">
          <button onclick="closeSkillModal()" class="h-8 px-4 rounded-lg bg-base-700 text-xs text-gray-400 hover:bg-base-600 transition-all">Annuler</button>
          <button onclick="saveSkill()" class="h-8 px-4 rounded-lg bg-violet-500 hover:bg-violet-400 text-xs font-medium text-white transition-all">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="static/auth.js"></script>
  <script src="static/ged.js"></script>
</body>
</html>
