<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Elyria</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/static/icons/favicon.ico" />
  <style>
    :root{--bg:#0a0f1c;--bg2:#0f1629;--bg3:#141c35;--tx:#94a3b8;--tx2:#64748b;--pr:#7c3aed;--prl:#8b5cf6;--ac:#06b6d4}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);touch-action:manipulation;overflow-x:hidden}
    input,textarea,button{font-size:16px!important;font-family:inherit}
    /* Layout */
    .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
    .header{display:flex;align-items:center;justify-content:space-between;padding:0 1rem;height:3rem;background:var(--bg2);border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
    .header-l{display:flex;align-items:center;gap:.5rem}
    .header-l img{width:1.5rem;height:1.5rem}
    .header-r{display:flex;gap:.25rem}
    .header-btn{width:2.25rem;height:2.25rem;border-radius:.5rem;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--tx2);cursor:pointer;transition:all .15s}
    .header-btn:active{background:rgba(255,255,255,.05);color:var(--tx)}
    .content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
    /* Bottom nav */
    .bnav{display:flex;background:var(--bg2);border-top:1px solid rgba(255,255,255,.05);padding:.25rem;padding-bottom:max(.25rem,env(safe-area-inset-bottom));flex-shrink:0}
    .bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;padding:.5rem;background:none;border:none;color:var(--tx2);font-size:.6rem;font-weight:500;cursor:pointer;border-radius:.75rem;transition:all .15s}
    .bnav-btn.active{color:var(--prl)}.bnav-btn svg{width:1.25rem;height:1.25rem}
    .bnav-btn:active{background:rgba(255,255,255,.03)}
    /* Page */
    .page{display:none;padding:1rem}.page.active{display:block}
    /* Method bar */
    .mbar{display:flex;gap:.35rem;margin-bottom:1rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .mbar::-webkit-scrollbar{display:none}
    .mchip{height:2.5rem;padding:0 .85rem;border-radius:.65rem;border:1px solid rgba(255,255,255,.06);font-size:.7rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;color:var(--tx2);background:var(--bg2)}
    .mchip:active{background:rgba(124,58,237,.1);border-color:rgba(124,58,237,.25);color:var(--prl)}
    .mchip.on{background:rgba(124,58,237,.12)!important;border-color:rgba(124,58,237,.3)!important;color:var(--prl)!important}
    /* Inputs */
    .input{width:100%;height:3rem;padding:0 1rem;border-radius:.75rem;background:var(--bg2);border:1px solid rgba(255,255,255,.06);color:#e2e8f0;outline:none;transition:border .15s;font-family:'SF Mono',monospace}
    .input:focus{border-color:rgba(124,58,237,.4);box-shadow:0 0 0 3px rgba(124,58,237,.08)}
    .input::placeholder{color:#334155}
    .ta{width:100%;padding:.75rem 1rem;border-radius:.75rem;background:var(--bg2);border:1px solid rgba(255,255,255,.06);color:#e2e8f0;outline:none;resize:none;transition:border .15s;font-family:'SF Mono',monospace;line-height:1.5}
    .ta:focus{border-color:rgba(124,58,237,.4);box-shadow:0 0 0 3px rgba(124,58,237,.08)}
    .ta::placeholder{color:#334155}
    /* Buttons */
    .btn{width:100%;height:3.25rem;border-radius:.75rem;border:none;font-size:.85rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;transition:all .15s}
    .btn:active{transform:scale(.97)}
    .btn-primary{background:linear-gradient(135deg,var(--pr),var(--prl));color:#fff;box-shadow:0 4px 20px rgba(124,58,237,.3)}
    .btn-ghost{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:var(--tx)}
    .btn-sm{height:2.25rem;padding:0 .75rem;font-size:.7rem;border-radius:.5rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:var(--tx2);cursor:pointer}
    /* Response */
    .resp{border-radius:.85rem;background:var(--bg2);border:1px solid rgba(255,255,255,.06);overflow:hidden;animation:fadeIn .2s}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .resp-h{display:flex;align-items:center;justify-content:space-between;padding:.6rem .85rem;border-bottom:1px solid rgba(255,255,255,.04)}
    .resp-status{font-size:.7rem;font-weight:700;font-family:'SF Mono',monospace}
    .resp-status.ok{color:#4ade80}.resp-status.err{color:#f87171}
    .resp-time{font-size:.6rem;color:var(--tx2)}
    .resp-body{padding:.75rem .85rem;font-size:.68rem;font-family:'SF Mono',monospace;line-height:1.6;white-space:pre-wrap;word-break:break-all;max-height:18rem;overflow-y:auto;color:#cbd5e1}
    .resp-actions{display:flex;gap:.4rem;padding:.5rem .85rem;border-top:1px solid rgba(255,255,255,.04)}
    /* History items */
    .hitem{display:flex;align-items:center;gap:.75rem;padding:.75rem .85rem;border-radius:.75rem;cursor:pointer;transition:all .1s;border:1px solid transparent;margin-bottom:.25rem}
    .hitem:active{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.04)}
    .hitem-method{font-size:.6rem;font-weight:700;padding:.15rem .4rem;border-radius:.3rem;font-family:'SF Mono',monospace;flex-shrink:0}
    .hitem-url{flex:1;font-size:.7rem;font-family:'SF Mono',monospace;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hitem-status{font-size:.65rem;font-family:'SF Mono',monospace;font-weight:600}
    .hitem-time{font-size:.55rem;color:var(--tx2)}
    /* Header kv */
    .hkv{display:flex;gap:.4rem;margin-bottom:.4rem}
    .hkv input{flex:1;height:2.5rem;padding:0 .65rem;border-radius:.55rem;background:var(--bg3);border:1px solid rgba(255,255,255,.05);color:var(--tx);outline:none;font-size:.68rem;font-family:'SF Mono',monospace}
    .hkv input:focus{border-color:rgba(6,182,212,.25)}
    .hkv-del{width:2.5rem;height:2.5rem;border-radius:.55rem;display:flex;align-items:center;justify-content:center;background:none;border:1px solid rgba(255,255,255,.04);color:var(--tx2);cursor:pointer;flex-shrink:0}
    .hkv-del:active{background:rgba(239,68,68,.1);color:#f87171}
    /* Empty */
    .empty{text-align:center;padding:3rem 1rem;color:var(--tx2);font-size:.7rem}
    /* Section label */
    .slabel{font-size:.58rem;text-transform:uppercase;letter-spacing:.15em;color:var(--tx2);margin-bottom:.5rem;font-weight:600}
    /* Spinner */
    .spinner{width:1.25rem;height:1.25rem;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Spacing */
    .gap-sm{gap:.5rem}.gap-md{gap:.75rem}.mt-sm{margin-top:.5rem}.mt-md{margin-top:.75rem}.mb-sm{margin-bottom:.5rem}.mb-md{margin-bottom:.75rem}
    .flex{display:flex}.flex-col{flex-direction:column}
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <a href="/app" style="display:flex;align-items:center;gap:.5rem;text-decoration:none;color:inherit" class="header-l">
      <img src="/static/icons/icon.svg" alt="" width="24" height="24" style="display:block" />
      <span style="font-size:.75rem;font-weight:500;letter-spacing:.2em;color:var(--tx)">elyria</span>
    </a>
    <div class="header-r">
      <button class="header-btn" onclick="logout()" title="Deconnexion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
      </button>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="content" id="content">

    <!-- BUILDER PAGE -->
    <div class="page active" id="page-builder">
      <!-- Method chips -->
      <div class="mbar" id="mbar"></div>
      <!-- URL -->
      <input class="input" id="url" type="url" placeholder="https://api.example.com/v1/users" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <!-- Headers -->
      <div class="mt-md"><div class="slabel">Headers</div><div id="headers"></div><button class="btn-sm mt-sm" onclick="addHeader()">+ Ajouter un header</button></div>
      <!-- Body -->
      <div class="mt-md"><div class="slabel">Body</div><textarea class="ta" id="body" placeholder='{"key":"value"}' style="height:7rem"></textarea></div>
      <!-- Send -->
      <button class="btn btn-primary mt-md" id="send-btn" onclick="send()">Envoyer la requete</button>
      <!-- Response -->
      <div id="resp" style="display:none;margin-top:.75rem"></div>
    </div>

    <!-- HISTORY PAGE -->
    <div class="page" id="page-history">
      <div class="slabel mb-sm">Requetes recentes</div>
      <div id="hlist"><div class="empty">Aucune requete pour l'instant</div></div>
    </div>

    <!-- ELY PAGE -->
    <div class="page" id="page-ely">
      <div id="ely-mobile-chat" style="display:flex;flex-direction:column;height:100%">
        <div id="ely-mobile-msgs" style="flex:1;overflow-y:auto;padding:.5rem 0;display:flex;flex-direction:column;gap:.5rem"></div>
        <div style="display:flex;gap:.4rem;padding:.5rem 0;border-top:1px solid rgba(255,255,255,.06)">
          <input id="ely-mobile-input" type="text" placeholder="Parle a Ely..." style="flex:1;height:2.75rem;padding:0 .75rem;border-radius:.75rem;background:var(--bg3);border:1px solid rgba(255,255,255,.06);color:#e2e8f0;outline:none;font-size:.8rem" autocomplete="off" />
          <button id="ely-mobile-send" onclick="sendElyMobile()" style="width:2.75rem;height:2.75rem;border-radius:.75rem;border:none;background:linear-gradient(135deg,var(--pr),var(--prl));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bnav">
    <button class="bnav-btn active" data-page="builder" onclick="switchPage('builder')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
      Requete
    </button>
    <button class="bnav-btn" data-page="history" onclick="switchPage('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Historique
    </button>
    <button class="bnav-btn" data-page="ely" onclick="switchPage('ely')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M8 9.5h8M8 13h5.5"/></svg>
      Ely
    </button>
  </nav>
</div>

<script src="static/auth.js"></script>
<script>
var $=function(s){return document.querySelector(s)},$$=function(s){return document.querySelectorAll(s)}
var API='/api/request',HK='elyria_m_hist',_method='GET',headers=[{key:'Content-Type',value:'application/json'}],
methods=['GET','POST','PUT','PATCH','DELETE','HEAD'],
mcolors={GET:'#4ade80',POST:'#f59e0b',PUT:'#3b82f6',PATCH:'#06b6d4',DELETE:'#ef4444',HEAD:'#9ca3af'};

function switchPage(p){
  $$('.page').forEach(function(e){e.classList.remove('active')})
  $('#page-'+p).classList.add('active')
  $$('.bnav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.page===p)})
  if(p==='history') renderHistory()
}

// ── Method chips ──
function buildMbar(){
  $('#mbar').innerHTML=methods.map(function(m){var on=m===_method?' on':'';return'<button class="mchip'+on+'" onclick="setMethod(\''+m+'\')" style="color:'+mcolors[m]+'">'+m+'</button>'}).join('')
}
function setMethod(m){_method=m;buildMbar()}
buildMbar()

// ── Headers ──
function addHeader(k,v){k=k||'';v=v||'';headers.push({key:k,value:v});renderHeaders()}
function removeHeader(i){headers.splice(i,1);renderHeaders()}
function renderHeaders(){
  $('#headers').innerHTML=headers.map(function(h,i){return'<div class="hkv"><input value="'+esc(h.key)+'" placeholder="Key" onchange="headers['+i+'].key=this.value" autocomplete="off" autocorrect="off" spellcheck="false" /><input value="'+esc(h.value)+'" placeholder="Value" onchange="headers['+i+'].value=this.value" autocomplete="off" /><button class="hkv-del" onclick="removeHeader('+i+')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button></div>'}).join('')
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
renderHeaders()

// ── Send ──
function send(){
  var url=$('#url').value.trim();if(!url)return;
  var btn=$('#send-btn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  var hdrs={};headers.forEach(function(h){if(h.key)hdrs[h.key]=h.value})
  var t0=performance.now();
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:getAuthHeader?getAuthHeader().Authorization:''},body:JSON.stringify({method:_method,url:url,headers:hdrs,body:$('#body').value.trim()||undefined,verify_ssl:!0})})
  .then(function(r){return r.json()}).then(function(d){
    var r=d.response||d,el=Math.round(performance.now()-t0),bodyStr=typeof r.body==='string'?r.body:JSON.stringify(r.body,null,2);
    showResp(r.status_code,el,bodyStr)
    saveHist(_method,url,r.status_code,el)
    btn.disabled=false;btn.innerHTML='Envoyer la requete'
  }).catch(function(e){
    showResp(0,0,e.message)
    btn.disabled=false;btn.innerHTML='Envoyer la requete'
  })
}

function showResp(code,time,body){
  var ok=code>0&&code<400;
  $('#resp').style.display='block'
  $('#resp').innerHTML='<div class="resp"><div class="resp-h"><span class="resp-status '+(ok?'ok':'err')+'">'+(code||'ERR')+' '+(code?(ok?'OK':'FAIL'):'')+'</span><span class="resp-time">'+(time?time+'ms':'')+'</span></div><div class="resp-body">'+esc(body)+'</div><div class="resp-actions"><button class="btn-sm" onclick="copyResp()">Copier la reponse</button><button class="btn-sm" onclick="replayLast()">Rejouer</button></div></div>'
  $('#content').scrollTop=$('#resp').offsetTop-80
}

function copyResp(){
  var t=$('#resp .resp-body').textContent
  navigator.clipboard.writeText(t).then(function(){
    var b=$('#resp .btn-sm');b.textContent='Copie !';setTimeout(function(){b.textContent='Copier la reponse'},1500)
  })
}
function replayLast(){send()}

// ── History ──
function getHist(){try{return JSON.parse(sessionStorage.getItem(HK)||'[]')}catch(e){return[]}}
function saveHist(m,u,s,t){
  var h=getHist();h.unshift({method:m,url:u,status:s,time:t,ts:Date.now()});if(h.length>30)h=h.slice(0,30)
  sessionStorage.setItem(HK,JSON.stringify(h))
}
function renderHistory(){
  var h=getHist(),el=$('#hlist')
  if(!h.length){el.innerHTML='<div class="empty">Aucune requete pour l\'instant</div>';return}
  el.innerHTML=h.map(function(r,i){
    var sc=r.status<400?'#4ade80':'#f87171'
    return'<div class="hitem" onclick="replay('+i+')"><span class="hitem-method" style="background:'+(mcolors[r.method]+'20')+';color:'+mcolors[r.method]+'">'+r.method+'</span><span class="hitem-url">'+esc(r.url)+'</span><span class="hitem-status" style="color:'+sc+'">'+r.status+'</span><span class="hitem-time">'+r.time+'ms</span></div>'
  }).join('')
}
function replay(i){
  var r=getHist()[i];if(!r)return;_method=r.method;buildMbar();$('#url').value=r.url;switchPage('builder');$('#url').focus()
}

// ── Ely mobile chat ──
var _elyMessages = [];
function addElyMsg(role, content) {
  _elyMessages.push({role:role,content:content});
  var c = $('#ely-mobile-msgs');
  var d = document.createElement('div');
  d.style.cssText = 'max-width:90%;padding:.6rem .85rem;border-radius:.85rem;font-size:.75rem;line-height:1.5;animation:fadeIn .2s;' +
    (role==='user' ? 'align-self:flex-end;background:rgba(124,58,237,.15);color:#d1d5db;border-bottom-right-radius:.3rem;' :
     'align-self:flex-start;background:rgba(255,255,255,.04);color:#cbd5e1;border-bottom-left-radius:.3rem;');
  d.textContent = content;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
  return d;
}

async function sendElyMobile() {
  var input = $('#ely-mobile-input');
  var btn = $('#ely-mobile-send');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  btn.disabled = true;
  addElyMsg('user', text);
  var loadEl = addElyMsg('ely', '...');
  try {
    var token = sessionStorage.getItem('elyria_token') || '';
    var resp = await fetch('/api/ely/chat', {
      method: 'POST', credentials: 'include',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({page:'app',message:text,context:{},history:_elyMessages.slice(0,-1),slot:'flash'})
    });
    var data = await resp.json();
    loadEl.textContent = data.reply || '(pas de reponse)';
    if (data.actions && data.actions.length) {
      var t = document.createElement('div');
      t.style.cssText = 'font-size:.6rem;color:#a78bfa;padding:.2rem 0';
      t.textContent = data.actions.map(function(a){return '✓ '+a.name.replace('ely_','')}).join(' · ');
      loadEl.parentNode.appendChild(t);
    }
  } catch(e) { loadEl.textContent = 'Erreur: ' + (e.message||'connexion'); }
  btn.disabled = false;
}

$('#ely-mobile-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); sendElyMobile(); }
});

// ── Init ──
$('#url').focus()
</script>
</body>
</html>
