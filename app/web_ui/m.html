<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Elyria — Quick</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/static/icons/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{base:{900:'#0a0f1c',800:'#0f1629',700:'#141c35',600:'#1a2340',500:'#212b4a'},primary:{DEFAULT:'#7c3aed',light:'#8b5cf6',dark:'#6d28d9'},accent:{DEFAULT:'#06b6d4',light:'#22d3ee',dark:'#0891b2'}}}}};</script>
  <style>
    *{-webkit-tap-highlight-color:transparent}
    body{font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}
    input,select,textarea,button{font-size:16px!important}
    .portrait-overlay{display:none}
    @media(orientation:portrait){.portrait-overlay{display:flex}}
    @media(orientation:landscape){.portrait-overlay{display:none}}
  </style>
</head>
<body class="bg-base-900 text-gray-200 overflow-hidden h-full flex flex-col">

<!-- PORTRAIT WARNING -->
<div class="portrait-overlay fixed inset-0 z-50 bg-base-900/95 flex items-center justify-center p-8 text-center" onclick="this.remove()">
  <div>
    <svg class="w-12 h-12 text-slate-400 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/></svg>
    <p class="text-sm text-slate-400 mb-1">Tournez votre telephone</p>
    <p class="text-xs text-gray-600">Le mode paysage offre une meilleure experience</p>
    <button class="mt-4 h-10 px-6 rounded-xl bg-slate-500/10 border border-slate-500/20 text-xs text-slate-400">Continuer quand meme</button>
  </div>
</div>

<!-- TOP BAR -->
<header class="h-12 bg-base-800 border-b border-white/5 flex items-center justify-between px-4 shrink-0">
  <div class="flex items-center gap-2">
    <img src="/static/icons/icon.svg" class="w-6 h-6" alt="" />
    <span class="text-xs font-medium tracking-widest text-slate-400">elyria</span>
  </div>
  <div class="flex items-center gap-1">
    <button onclick="navigateTo('/app')" class="h-8 w-8 rounded-lg flex items-center justify-center text-gray-500 hover:text-gray-300">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V21m0-10.5L16.5 12m-3-1.5L10.5 12m3-1.5V3m0 0L16.5 4.5M13.5 3L10.5 4.5"/></svg>
    </button>
    <button onclick="logout()" class="h-8 w-8 rounded-lg flex items-center justify-center text-gray-500 hover:text-red-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
    </button>
  </div>
</header>

<!-- REQUEST BUILDER -->
<main class="flex-1 flex flex-col overflow-hidden">
  <div class="p-4 space-y-3 flex-1 overflow-y-auto">
    <!-- Method + URL -->
    <div class="flex gap-2">
      <select id="req-method" class="h-12 px-3 rounded-xl bg-base-700 border border-white/8 font-semibold text-primary-light text-center appearance-none shrink-0" style="min-width:5rem">
        <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
      </select>
      <input id="req-url" type="url" placeholder="https://api.example.com/v1/resource" class="flex-1 h-12 px-4 rounded-xl bg-base-900/70 border border-white/5 font-mono text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-primary/50" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>

    <!-- Headers -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Headers</span>
        <button onclick="addHeader()" class="h-7 w-7 rounded-lg bg-base-700 hover:bg-base-600 flex items-center justify-center text-gray-400"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg></button>
      </div>
      <div id="headers-list" class="space-y-2"></div>
    </div>

    <!-- Body -->
    <div>
      <span class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Body</span>
      <textarea id="req-body" placeholder='{"key":"value"}' class="w-full h-32 mt-2 p-3 rounded-xl bg-base-900/70 border border-white/5 font-mono text-sm text-gray-300 placeholder-gray-700 resize-none focus:outline-none focus:border-primary/50"></textarea>
    </div>

    <!-- Response -->
    <div id="resp-area" class="hidden space-y-2">
      <div class="flex items-center justify-between">
        <span id="resp-status" class="text-sm font-mono font-bold"></span>
        <span id="resp-time" class="text-[10px] text-gray-500"></span>
      </div>
      <pre id="resp-body" class="p-3 rounded-xl bg-base-700/40 border border-white/5 text-xs font-mono text-gray-300 whitespace-pre-wrap break-all max-h-64 overflow-y-auto"></pre>
    </div>
  </div>

  <!-- Send button fixed at bottom -->
  <div class="p-4 pt-2 border-t border-white/5 shrink-0">
    <button id="btn-send" class="w-full h-14 rounded-xl bg-gradient-to-r from-primary to-primary-light hover:from-primary-light hover:to-primary text-white text-base font-semibold shadow-lg shadow-primary/25 active:scale-[0.97] transition-all flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
      Envoyer
    </button>
  </div>
</main>

<script src="static/auth.js"></script>
<script>
// ── State ──
let headers = [];
const $ = s => document.querySelector(s);
const API = '/api/request';

// ── Headers ──
function addHeader(k='',v='') {
  headers.push({key:k,value:v});
  renderHeaders();
}
function removeHeader(i) { headers.splice(i,1); renderHeaders(); }
function renderHeaders() {
  const el = document.getElementById('headers-list');
  el.innerHTML = headers.map((h,i) => `
    <div class="flex gap-2">
      <input class="flex-1 h-10 px-3 rounded-xl bg-base-700 border border-white/5 font-mono text-xs text-gray-200 placeholder-gray-600 focus:outline-none focus:border-accent/30" value="${h.key}" placeholder="Content-Type" onchange="headers[${i}].key=this.value" autocomplete="off" />
      <input class="flex-1 h-10 px-3 rounded-xl bg-base-700 border border-white/5 font-mono text-xs text-gray-200 placeholder-gray-600 focus:outline-none focus:border-accent/30" value="${h.value}" placeholder="application/json" onchange="headers[${i}].value=this.value" autocomplete="off" />
      <button onclick="removeHeader(${i})" class="h-10 w-10 rounded-xl bg-red-500/5 hover:bg-red-500/10 flex items-center justify-center text-gray-500 hover:text-red-400 shrink-0">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  `).join('');
}
addHeader('Content-Type','application/json');

// ── Send ──
$('#btn-send').addEventListener('click', async () => {
  const method = $('#req-method').value;
  const url = $('#req-url').value.trim();
  const body = $('#req-body').value.trim();
  if (!url) return;

  const btn = $('#btn-send');
  btn.disabled = true;
  btn.innerHTML = '<span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>';

  const hdrs = {};
  headers.forEach(h => { if(h.key) hdrs[h.key] = h.value });

  const t0 = performance.now();
  try {
    const res = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'application/json', ...getAuthHeader()},
      body: JSON.stringify({ method, url, headers: hdrs, body: body || undefined, verify_ssl: true })
    });
    const data = await res.json();
    const resp = data.response || data;
    const elapsed = Math.round(performance.now() - t0);

    const area = $('#resp-area');
    area.classList.remove('hidden');
    $('#resp-status').textContent = `${resp.status_code} ${resp.status_code >= 400 ? '✗' : '✓'}`;
    $('#resp-status').className = `text-sm font-mono font-bold ${resp.status_code >= 400 ? 'text-red-400' : 'text-green-400'}`;
    $('#resp-time').textContent = `${elapsed}ms`;
    $('#resp-body').textContent = typeof resp.body === 'string' ? resp.body : JSON.stringify(resp.body, null, 2);
  } catch(e) {
    const area = $('#resp-area');
    area.classList.remove('hidden');
    $('#resp-status').textContent = 'ERR';
    $('#resp-status').className = 'text-sm font-mono font-bold text-red-400';
    $('#resp-body').textContent = e.message;
  }
  btn.disabled = false;
  btn.innerHTML = '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg> Envoyer';
});

// ── Init ──
if (initAuth) { initAuth(); }
$('#req-url').focus();
</script>
</body>
</html>
